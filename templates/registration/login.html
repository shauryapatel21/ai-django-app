{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-slate-800/80 border border-slate-700 p-8 rounded-2xl shadow-xl mt-8 space-y-6">
  <div class="text-center">
    <h2 class="text-2xl font-bold text-white">Student Login</h2>
    <p class="text-sm text-slate-400 mt-1">Access your purchased course and sandbox</p>
  </div>

  {% if form.errors %}
    <div class="bg-rose-500/10 border border-rose-500/30 text-rose-400 p-3.5 rounded-xl text-xs space-y-1">
      <p class="font-medium">• Invalid username or password. Please verify and retry.</p>
    </div>
  {% endif %}

  <form method="POST" class="space-y-4">
    {% csrf_token %}
    <div class="space-y-4 text-sm text-slate-200" id="login-fields">
      <div class="space-y-1 text-left">
        <label for="id_username" class="block text-xs font-semibold uppercase tracking-wider text-slate-300">
          Username
        </label>
        <input type="text" name="username" autofocus required id="id_username" placeholder="Enter username" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
      </div>

      <div class="space-y-1 text-left">
        <label for="id_password" class="block text-xs font-semibold uppercase tracking-wider text-slate-300">
          Password
        </label>
        <input type="password" name="password" required id="id_password" placeholder="Enter password" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
      </div>
    </div>

    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-xl transition cursor-pointer">
      Login to Dashboard
    </button>
  </form>

  <p class="text-xs text-center text-slate-400">
    Don't have an account? <a href="{% url 'register' %}" class="text-blue-400 hover:underline">Sign up here</a>
  </p>
</div>
{% endblock %}
