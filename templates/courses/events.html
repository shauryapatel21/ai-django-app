{% extends 'base.html' %}
{% block content %}
<div class="max-w-4xl mx-auto space-y-6">
  <h1 class="text-3xl font-bold text-white">Upcoming Hackathons & Tech Events</h1>
  <div class="grid gap-4">
    {% for ev in events %}
      <div class="bg-slate-800/60 border border-slate-800 p-6 rounded-2xl flex justify-between items-center">
        <div>
          <h2 class="text-lg font-bold text-white">{{ ev.name }}</h2>
          <p class="text-xs text-slate-400 mt-1">📅 {{ ev.date }} | {{ ev.tags }}</p>
        </div>
        <a href="{{ ev.registration_link }}" target="_blank" class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold px-5 py-2.5 rounded-xl">Register ↗</a>
      </div>
    {% empty %}
      <p class="text-slate-400">No events listed yet. Add some in /admin/!</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
